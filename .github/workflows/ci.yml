name: PulseTrade Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Integration Tests & Linting
  backend-test:
    name: Backend Tests & Database Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install Backend dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Integration Test Suite
        env:
          ATLASDB_URL: ${{ secrets.ATLASDB_URL }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          NODE_ENV: test
        run: |
          cd Backend
          npm test

  # 2. Dashboard React App Build Validation
  dashboard-build:
    name: Build React Trading Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install Dashboard dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Dashboard Production Bundle
        run: |
          cd dashboard
          npm run build

  # 3. Frontend Marketing React App Build Validation
  frontend-build:
    name: Build React Marketing Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
