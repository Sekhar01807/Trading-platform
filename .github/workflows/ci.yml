name: PulseTrade Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Integration Tests & Database Integration
  backend-test:
    name: Backend Tests & Database Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Start Ephemeral MongoDB Replica Set (For Multi-Document ACID Transactions)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0 --replSet rs0 --bind_ip_all
          sleep 4
          docker exec mongodb mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          sleep 2

      - name: Install Backend dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Integration Test Suite
        env:
          ATLASDB_URL: ${{ secrets.ATLASDB_URL || 'mongodb://127.0.0.1:27017/pulsetrade_test?replicaSet=rs0&directConnection=true' }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY || 'PulseTrade_CI_Test_JWT_Secret_Key_2026!@#' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_simulated_key' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'test_secret_for_mocking' }}
          NODE_ENV: test
        run: |
          cd Backend
          npm test

  # 2. Dashboard React App Build Validation
  dashboard-build:
    name: Build React Trading Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install Dashboard dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Dashboard Production Bundle
        run: |
          cd dashboard
          npm run build

  # 3. Frontend Marketing React App Build Validation
  frontend-build:
    name: Build React Marketing Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
